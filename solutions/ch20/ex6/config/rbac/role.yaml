---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - monitoring.coreos.com
  resources:
  - prometheusrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - watchtower.platformgo.dev
  resources:
  - healthchecks
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - watchtower.platformgo.dev
  resources:
  - healthchecks/finalizers
  verbs:
  - update
- apiGroups:
  - watchtower.platformgo.dev
  resources:
  - healthchecks/status
  verbs:
  - get
  - patch
  - update
