---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: healthchecks.watchtower.platformgo.dev
spec:
  group: watchtower.platformgo.dev
  names:
    categories:
    - watchtower
    kind: HealthCheck
    listKind: HealthCheckList
    plural: healthchecks
    shortNames:
    - hc
    singular: healthcheck
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Healthy")].status
      name: Healthy
      type: string
    - jsonPath: .status.conditions[?(@.type=="Healthy")].reason
      name: Reason
      type: string
    - jsonPath: .status.consecutiveFailures
      name: Failures
      type: integer
    - jsonPath: .status.alerting.backend
      name: Alerting
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.resolvedURL
      name: Target
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HealthCheck continuously probes an endpoint, reports its health through
          status conditions and metrics, and keeps an alert rule in sync.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HealthCheckSpec is the desired state: what to probe, how often, and what
              counts as healthy.
            properties:
              alert:
                description: |-
                  Alert configures the alert rule generated for this check. Omit it to
                  probe without alerting.
                properties:
                  for:
                    default: 2m
                    description: For is how long the check must be failing before
                      the alert fires.
                    type: string
                  runbookURL:
                    description: RunbookURL is attached to the alert so the responder
                      knows what to do.
                    pattern: ^https?://
                    type: string
                  severity:
                    default: warning
                    description: Severity label attached to the alert.
                    enum:
                    - critical
                    - warning
                    - info
                    type: string
                  summary:
                    description: Summary is a one-line description shown in notifications.
                    maxLength: 256
                    type: string
                type: object
              expect:
                description: Expect refines what counts as a healthy response.
                properties:
                  maxLatency:
                    description: MaxLatency marks a response unhealthy if it is slower
                      than this.
                    type: string
                  statusCodes:
                    description: StatusCodes that count as healthy. Empty means any
                      2xx or 3xx.
                    items:
                      format: int32
                      type: integer
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: set
                type: object
              failureThreshold:
                default: 3
                description: |-
                  FailureThreshold is the number of consecutive failed probes before the
                  check is reported unhealthy. Brief blips below it are absorbed.
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              interval:
                default: 30s
                description: Interval between probes.
                type: string
                x-kubernetes-validations:
                - message: interval must be at least 5s
                  rule: duration(self) >= duration('5s')
              suspend:
                description: Suspend pauses probing without deleting the check or
                  its alert rule.
                type: boolean
              target:
                description: Target is the endpoint to probe.
                properties:
                  service:
                    description: Service is a Service in the HealthCheck's namespace.
                    properties:
                      name:
                        description: Name of the Service, in the same namespace as
                          the HealthCheck.
                        maxLength: 63
                        minLength: 1
                        type: string
                      path:
                        default: /healthz
                        description: Path to request.
                        pattern: ^/
                        type: string
                      port:
                        description: Port number on the Service.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      scheme:
                        default: http
                        description: Scheme to use.
                        enum:
                        - http
                        - https
                        type: string
                    required:
                    - name
                    - port
                    type: object
                  url:
                    description: URL is an absolute http(s) URL, typically for endpoints
                      outside the cluster.
                    maxLength: 2048
                    pattern: ^https?://[^\s/]+
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of url or service must be set
                  rule: has(self.url) != has(self.service)
              timeout:
                default: 5s
                description: Timeout for a single probe. Must be shorter than interval.
                type: string
            required:
            - target
            type: object
            x-kubernetes-validations:
            - message: timeout must be shorter than interval
              rule: duration(self.timeout) < duration(self.interval)
          status:
            description: |-
              HealthCheckStatus is the observed state. Fields are written only when they
              change, so a steadily healthy check causes no API writes at all.
            properties:
              alerting:
                description: Alerting reports where the alert rule lives.
                properties:
                  backend:
                    description: 'Backend that owns the rule: prometheus, datadog,
                      or none.'
                    type: string
                  observedGeneration:
                    description: ObservedGeneration is the spec generation last synced
                      to the backend.
                    format: int64
                    type: integer
                  ref:
                    description: |-
                      Ref identifies the rule in that backend, e.g. a PrometheusRule name or
                      a Datadog monitor ID.
                    type: string
                required:
                - backend
                type: object
              conditions:
                description: 'Conditions: Healthy and AlertingReady.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: |-
                  ConsecutiveFailures counts failed probes since the last success. It
                  saturates at failureThreshold, so a long outage doesn't rewrite status
                  on every probe; the Healthy condition's lastTransitionTime says how
                  long the check has been failing.
                format: int32
                type: integer
              lastFailure:
                description: LastFailure describes the most recent failed probe.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              resolvedURL:
                description: ResolvedURL is the URL actually probed.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
