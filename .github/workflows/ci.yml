name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly, so new advisories surface without a push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The root module: shared packages and the tools from Parts I-II.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go test -race -count=1 ./...

  # Protocol buffers (Chapter 10): lint, and the generated Go code in
  # pkg/platnotify/notifyv1 matches proto/. Tools come from tools/proto.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/proto/go.mod
      - run: go mod tidy -diff
        working-directory: tools/proto
      - run: go tool -modfile=tools/proto/go.mod buf lint
      - name: Generated code is up to date
        run: |
          go tool -modfile=tools/proto/go.mod buf generate
          git diff --exit-code -- pkg/platnotify

  # The watchtower operator: unit tests plus envtest against a real API server.
  watchtower:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/watchtower
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: projects/watchtower/go.mod
      - run: go mod tidy -diff
      - name: Generated code and manifests are up to date
        run: |
          make manifests generate
          git diff --exit-code -- api config
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: projects/watchtower
      - run: make test

  # Example modules with their own go.mod (heavier or demo-only dependencies).
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - examples/ch01/tools
          - examples/ch06/sweepscript
          - examples/ch06/containers # testcontainers: needs Docker (present on the runner)
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
      - run: go test -race -count=1 ./...

  # The build track (book/AUTHORING.md): every step and solution module builds,
  # lints and passes its race tests; every new or changed line of every step is
  # printed in the book; exercise tests fail on their base step; final steps
  # match the production code they became.
  # One job per chapter, so the build track checks run in parallel and a
  # failure names its chapter. Add a chapter here when it joins the track.
  workbook:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter: ["00", "01", "02", "03", "04", "05", "06", "20"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: envtest binaries (operator build steps)
        if: matrix.chapter == '20'
        working-directory: projects/watchtower
        run: |
          make setup-envtest
          echo "KUBEBUILDER_ASSETS=$(bin/setup-envtest use 1.37.0 --bin-dir "$PWD/bin" -p path)" >> "$GITHUB_ENV"
      - name: Build track checks
        run: python3 book/scripts/check_workbook.py --race --chapter ${{ matrix.chapter }}
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint every step and solution module
        run: |
          ch=ch${{ matrix.chapter }}
          for m in $(find workbook/$ch solutions/$ch -name go.mod -not -path '*/exercises/*' -exec dirname {} \; | sort); do
            echo "== $m"
            (cd "$m" && golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" ./...) || exit 1
          done

  # Fails if a chapter directory exists that the matrix above doesn't list.
  workbook-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          want=$(ls -d workbook/ch* | sed 's#workbook/ch##' | sort | tr '\n' ' ')
          have=$(grep -o 'chapter: \[.*\]' .github/workflows/ci.yml | tr -dc '0-9 ' | tr -s ' ' | sed 's/^ //')
          [[ "$want" == "$have " || "$want" == "$have" ]] || { echo "matrix lists '$have', workbook has '$want'"; exit 1; }

  # Reachable known vulnerabilities fail the build (Chapter 1). govulncheck is
  # pinned as a tool in examples/ch01/tools/go.mod.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/ch01/tools/go.mod
      - name: govulncheck (root module)
        run: go tool -modfile=examples/ch01/tools/go.mod govulncheck ./...
      - name: govulncheck (watchtower)
        working-directory: projects/watchtower
        run: go tool -modfile=../../examples/ch01/tools/go.mod govulncheck ./...

  # Deploys the operator to kind and checks real behaviour end to end.
  watchtower-e2e:
    runs-on: ubuntu-latest
    needs: watchtower
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: projects/watchtower/go.mod
      - uses: helm/kind-action@v1
        with:
          cluster_name: watchtower
      - run: bash projects/watchtower/hack/e2e-kind.sh

  # The book: every listing is read from the code at build time, so a
  # compiling book proves the snippets still exist; widths must fit the page.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Listings fit the page
        run: python book/scripts/check_widths.py --max 86
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Build PDF
        run: typst compile --root . --font-path book/fonts book/main.typ platform-go.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: platform-go-pdf
          path: platform-go.pdf
