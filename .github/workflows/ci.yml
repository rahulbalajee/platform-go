name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The root module: shared packages and the tools from Parts I-II.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go test -race -count=1 ./...

  # The watchtower operator: unit tests plus envtest against a real API server.
  watchtower:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/watchtower
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: projects/watchtower/go.mod
      - name: Generated code and manifests are up to date
        run: |
          make manifests generate
          git diff --exit-code -- api config
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: projects/watchtower
      - run: make test

  # Deploys the operator to kind and checks real behaviour end to end.
  watchtower-e2e:
    runs-on: ubuntu-latest
    needs: watchtower
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: projects/watchtower/go.mod
      - uses: helm/kind-action@v1
        with:
          cluster_name: watchtower
      - run: projects/watchtower/hack/e2e-kind.sh

  # The book: every listing is read from the code at build time, so a
  # compiling book proves the snippets still exist; widths must fit the page.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Listings fit the page
        run: python book/scripts/check_widths.py --max 86
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Build PDF
        run: typst compile --root . --font-path book/fonts book/main.typ platform-go.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: platform-go-pdf
          path: platform-go.pdf
